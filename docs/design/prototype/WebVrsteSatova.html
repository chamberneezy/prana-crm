<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web · Vrste satova · Prana CRM</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=Cormorant+Garamond:ital,wght@1,500&amp;family=Montserrat:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2a322e}a:hover{color:#5c6b58}
</style>
<style>body{background:#f4efea}</style>
<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<script src="assets/bundle.js"></script>
<script src="assets/dclogic.js"></script>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="min-height: 980px; display: flex; flex-wrap: wrap; background: var(--linen); font-family: var(--font-ui); color: var(--ink);">
  <x-import component-from-global-scope="YogaCRM.Sidebar" items="{{nav}}" active="classes" logo-src="/_blob/0ddb75ad5382d4cb8d3056f0fcfdf42d" style="display: flex; align-self: stretch;"></x-import>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 48px 48px; box-sizing: border-box;">
    <div style="max-width: 1160px; display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <x-import component-from-global-scope="YogaCRM.PageHeader" title="Vrste satova">
          <x-import component-from-global-scope="YogaCRM.Button" variant="primary">Nova vrsta sata</x-import>
        </x-import>
        <p style="margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-muted);">Predlošci za planiranje. Dan i vrijeme birate tek kad dodajete termin u raspored.</p>
      </div>

      <section style="background: var(--white); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;">
        <div style="padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline;">
          <h2 style="margin: 0; font-size: 16px; font-weight: 600;">Joga</h2>
          <span style="font-size: 13px; color: var(--muted);">5 vrsta</span>
        </div>
        <div style="overflow-x: auto;">
          <table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 14px;">
            <thead>
              <tr style="background: var(--header-row);">
                <th scope="col" style="text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted);">Sat</th>
                <th scope="col" style="text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted);">Trajanje</th>
                <th scope="col" style="text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted);">Ulaz</th>
                <th scope="col" style="text-align: right; padding: 10px 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted);">Termina ovaj tjedan</th>
                <th scope="col" style="padding: 10px 16px;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Radnje</span></th>
              </tr>
            </thead>
            <tbody>
              <template data-sc="for" list="{{classes}}" as="c" hint-placeholder-count="5">
                <tr style="border-top: 1px solid var(--line-soft);">
                  <td style="padding: 12px 16px;">
                    <span style="display: inline-flex; align-items: center; gap: 12px; font-weight: 600;">
                      <span style="width: 10px; height: 22px; border-radius: 999px; background: {{c.color}};"></span>
                      {{c.name}}
                    </span>
                  </td>
                  <td style="padding: 12px 16px; font-variant-numeric: tabular-nums;">{{c.duration}}</td>
                  <td style="padding: 12px 16px; color: var(--ink-muted);">{{c.rule}}</td>
                  <td style="padding: 12px 16px; text-align: right; font-variant-numeric: tabular-nums;">{{c.count}}</td>
                  <td style="padding: 8px 16px; text-align: right; white-space: nowrap;">
                    <a href="WebRaspored.dc.html" style="font-size: 13px; font-weight: 600; text-decoration: none; color: var(--sage-deep); margin-right: 16px;">Zakaži</a>
                    <x-import component-from-global-scope="YogaCRM.Button" variant="ghost" size="sm">Uredi</x-import>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <section style="background: var(--white); border: 1px dashed var(--field); border-radius: 10px; padding: 24px;">
        <x-import component-from-global-scope="YogaCRM.EmptyState" title="Nova skupina">
          Kad studio ponudi masaže, radionice ili retreate, svaka skupina dobiva svoje vrste, cijene i boje.
        </x-import>
        <div style="margin-top: 12px;">
          <x-import component-from-global-scope="YogaCRM.Button" variant="secondary" size="sm">Dodaj skupinu</x-import>
        </div>
      </section>
    </div>
  </main>
</div>
</template>
<script>
class Component extends DCLogic {
  renderVals() {
    const c = (name, color, duration, rule, count) => ({ name, color, duration, rule, count });
    return {
      nav: [
        { id: 'overview', label: 'Pregled' },
        { id: 'schedule', label: 'Raspored' },
        { id: 'classes', label: 'Vrste satova' },
        { id: 'members', label: 'Članovi' },
        { id: 'plans', label: 'Karte i članarine' },
        { id: 'payments', label: 'Uplate' }
      ],
      classes: [
        c('Joga za kralježnicu', 'var(--class-spine)', '60 min', 'Na početku sata', 2),
        c('Ashtanga Mysore', 'var(--class-ashtanga)', '120 min', 'Do 60 min nakon početka', 3),
        c('Restorativna joga', 'var(--class-restorative)', '60 min', 'Na početku sata', 2),
        c('Black Lotus Yoga', 'var(--class-black-lotus)', '75 min', 'Na početku sata', 2),
        c('Pranayama & meditacija', 'var(--class-pranayama)', '30 min', 'Slobodan ulaz', 1)
      ]
    };
  }
}
</script>
<script src="assets/renderer.js"></script>
</body>
</html>
