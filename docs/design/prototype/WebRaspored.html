<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web · Raspored · Prana CRM</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=Cormorant+Garamond:ital,wght@1,500&amp;family=Montserrat:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2a322e}a:hover{color:#5c6b58}
</style>
<style>body{background:#f4efea}</style>
<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<script src="assets/bundle.js"></script>
<script src="assets/dclogic.js"></script>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="min-height: 980px; display: flex; flex-wrap: wrap; background: var(--linen); font-family: var(--font-ui); color: var(--ink);">
  <x-import component-from-global-scope="YogaCRM.Sidebar" items="{{nav}}" active="schedule" logo-src="/_blob/0ddb75ad5382d4cb8d3056f0fcfdf42d" style="display: flex; align-self: stretch;"></x-import>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 48px 48px; box-sizing: border-box;">
    <div style="max-width: 1160px; display: flex; flex-direction: column; gap: 24px;">
      <x-import component-from-global-scope="YogaCRM.PageHeader" title="Raspored">
        <div style="display: inline-flex; align-items: center; gap: 4px;">
          <x-import component-from-global-scope="YogaCRM.Button" variant="ghost" size="sm">‹</x-import>
          <span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0 6px;">12.–18.10.2026.</span>
          <x-import component-from-global-scope="YogaCRM.Button" variant="ghost" size="sm">›</x-import>
        </div>
        <x-import component-from-global-scope="YogaCRM.Button" variant="primary">Novi termin</x-import>
      </x-import>

      <div style="overflow-x: auto; border-radius: 10px;">
        <div style="min-width: 980px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;">
          <template data-sc="for" list="{{week}}" as="d" hint-placeholder-count="7">
            <div style="background: var(--white); min-height: 520px; display: flex; flex-direction: column;">
              <div style="padding: 12px 14px; background: var(--header-row); display: flex; justify-content: space-between; align-items: baseline;">
                <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted);">{{d.name}}</span>
                <span style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;">{{d.date}}</span>
              </div>
              <div style="padding: 10px; display: flex; flex-direction: column; gap: 8px;">
                <template data-sc="for" list="{{d.list}}" as="s" hint-placeholder-count="2">
                  <div style="border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                      <span style="width: 8px; height: 18px; border-radius: 999px; background: {{s.color}}; flex: none;"></span>
                      <span style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-muted);">{{s.time}}</span>
                    </div>
                    <span style="font-size: 13px; font-weight: 600; line-height: 1.35;">{{s.name}}</span>
                    <span style="font-size: 11px; color: var(--muted);">{{s.meta}}</span>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>

      <section style="background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;">
          <h2 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);">Dodaj termin iz vrste sata</h2>
          <a href="WebVrsteSatova.dc.html" style="font-size: 13px; font-weight: 600; text-decoration: none; color: var(--sage-deep);">Uredi vrste satova ›</a>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <template data-sc="for" list="{{classes}}" as="c" hint-placeholder-count="5">
            <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--field); background: var(--white); font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer;">
              <span style="width: 8px; height: 18px; border-radius: 999px; background: {{c.color}};"></span>
              {{c.name}}
            </button>
          </template>
        </div>
      </section>
    </div>
  </main>
</div>
</template>
<script>
class Component extends DCLogic {
  renderVals() {
    const C = {
      spine: { name: 'Joga za kralježnicu', color: 'var(--class-spine)' },
      ash: { name: 'Ashtanga Mysore', color: 'var(--class-ashtanga)' },
      rest: { name: 'Restorativna joga', color: 'var(--class-restorative)' },
      lotus: { name: 'Black Lotus Yoga', color: 'var(--class-black-lotus)' },
      pran: { name: 'Pranayama & meditacija', color: 'var(--class-pranayama)' }
    };
    const s = (c, time, meta) => ({ ...C[c], time, meta });
    return {
      nav: [
        { id: 'overview', label: 'Pregled' },
        { id: 'schedule', label: 'Raspored' },
        { id: 'classes', label: 'Vrste satova' },
        { id: 'members', label: 'Članovi' },
        { id: 'plans', label: 'Karte i članarine' },
        { id: 'payments', label: 'Uplate' }
      ],
      week: [
        { name: 'Pon', date: '12.10.', list: [s('spine', '09:00–10:00', '5 prijava'), s('ash', '17:00–19:00', 'ulaz do 18:00 · 8 prijava')] },
        { name: 'Uto', date: '13.10.', list: [s('rest', '19:15–20:15', '6 prijava')] },
        { name: 'Sri', date: '14.10.', list: [s('spine', '09:00–10:00', '4 prijave'), s('lotus', '18:15–19:30', '10 prijava')] },
        { name: 'Čet', date: '15.10.', list: [s('ash', '17:00–19:00', 'ulaz do 18:00 · 7 prijava'), s('rest', '19:15–20:15', '5 prijava')] },
        { name: 'Pet', date: '16.10.', list: [s('lotus', '18:15–19:30', '9 prijava'), s('pran', '19:45–20:15', 'slobodan ulaz')] },
        { name: 'Sub', date: '17.10.', list: [] },
        { name: 'Ned', date: '18.10.', list: [s('ash', '09:00–11:00', 'ulaz do 10:00 · 6 prijava')] }
      ],
      classes: [C.spine, C.ash, C.rest, C.lotus, C.pran]
    };
  }
}
</script>
<script src="assets/renderer.js"></script>
</body>
</html>
