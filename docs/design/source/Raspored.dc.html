<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Raspored</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/yogacrm/components/bundle.css">
<script src="ds/yogacrm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=Cormorant+Garamond:ital,wght@1,500&amp;family=Montserrat:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2a322e}a:hover{color:#5c6b58}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--linen); font-family: var(--font-ui); color: var(--ink);">
  <main style="padding: 60px 16px 108px; display: flex; flex-direction: column; gap: 16px;">
    <header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-muted);">Tjedan 12.–18.10.</span>
        <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.2;">Raspored</h1>
      </div>
      <x-import component-from-global-scope="YogaCRM.Button" variant="primary" size="sm">Novi termin</x-import>
    </header>

    <a href="VrsteSatova.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 0 16px; background: var(--white); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink);">
      <span style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600;">
        <span style="display: flex; gap: 3px;">
          <span style="width: 6px; height: 16px; border-radius: 999px; background: var(--class-spine);"></span>
          <span style="width: 6px; height: 16px; border-radius: 999px; background: var(--class-ashtanga);"></span>
          <span style="width: 6px; height: 16px; border-radius: 999px; background: var(--class-black-lotus);"></span>
        </span>
        Vrste satova
      </span>
      <span style="font-size: 13px; color: var(--muted);">5 predložaka ›</span>
    </a>

    <div role="tablist" aria-label="Dani u tjednu" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button type="button" role="tab" aria-selected="{{d.selected}}" onClick="{{d.pick}}" style="height: 60px; border-radius: 8px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-family: var(--font-ui); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0;">
          <span style="font-size: 11px; font-weight: 600;">{{d.short}}</span>
          <span style="font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;">{{d.num}}</span>
          <span style="width: 4px; height: 4px; border-radius: 999px; background: {{d.dot}};"></span>
        </button>
      </sc-for>
    </div>

    <h2 style="margin: 4px 0 0; font-size: 16px; font-weight: 600;">{{dayTitle}}</h2>

    <sc-if value="{{hasSessions}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <sc-for list="{{sessions}}" as="s" hint-placeholder-count="2">
          <article style="background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <span style="width: 10px; height: 22px; border-radius: 999px; background: {{s.color}}; flex: none;"></span>
              <span style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
                <span style="font-size: 15px; font-weight: 600;">{{s.name}}</span>
                <span style="font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums;">{{s.time}}{{s.note}}</span>
              </span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line-soft);">
              <span style="font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;">{{s.count}}</span>
              <x-import component-from-global-scope="YogaCRM.Button" variant="secondary" size="sm">Evidentiraj dolazak</x-import>
            </div>
          </article>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{noSessions}}" hint-placeholder-val="{{false}}">
      <div style="background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 32px 20px; text-align: center; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 14px; font-weight: 600;">Nema satova</span>
        <span style="font-size: 13px; color: var(--muted);">Dodajte termin iz vrsta satova.</span>
      </div>
    </sc-if>
  </main>

  <nav aria-label="Glavna navigacija" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 8px 0; background: var(--white); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: flex-start;">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; padding-top: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted);">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
      Pregled
    </a>
    <a href="Raspored.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; padding-top: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--ink);">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      Raspored
    </a>
    <a href="NoviClan.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; margin-top: -24px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--ink);">
      <span style="width: 56px; height: 56px; border-radius: 999px; background: var(--ink); color: var(--white); display: flex; align-items: center; justify-content: center; border: 4px solid var(--linen); box-sizing: border-box;">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"></path></svg>
      </span>
      Upis
    </a>
    <a href="Clanovi.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; padding-top: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted);">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      Članovi
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; padding-top: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted);">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>
      Uplate
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 0 };
  }
  renderVals() {
    const C = {
      spine: { name: 'Joga za kralježnicu', color: 'var(--class-spine)' },
      ash: { name: 'Ashtanga Mysore', color: 'var(--class-ashtanga)' },
      rest: { name: 'Restorativna joga', color: 'var(--class-restorative)' },
      lotus: { name: 'Black Lotus Yoga', color: 'var(--class-black-lotus)' },
      pran: { name: 'Pranayama & meditacija', color: 'var(--class-pranayama)' }
    };
    const s = (c, time, note, count) => ({ ...C[c], time, note: note ? ' · ' + note : '', count });
    const week = [
      { short: 'Pon', num: '12', long: 'Ponedjeljak, 12.10.', list: [s('spine', '09:00–10:00', '', '5 prijava'), s('ash', '17:00–19:00', 'ulaz do 18:00', '8 prijava')] },
      { short: 'Uto', num: '13', long: 'Utorak, 13.10.', list: [s('rest', '19:15–20:15', '', '6 prijava')] },
      { short: 'Sri', num: '14', long: 'Srijeda, 14.10.', list: [s('spine', '09:00–10:00', '', '4 prijave'), s('lotus', '18:15–19:30', '', '10 prijava')] },
      { short: 'Čet', num: '15', long: 'Četvrtak, 15.10.', list: [s('ash', '17:00–19:00', 'ulaz do 18:00', '7 prijava'), s('rest', '19:15–20:15', '', '5 prijava')] },
      { short: 'Pet', num: '16', long: 'Petak, 16.10.', list: [s('lotus', '18:15–19:30', '', '9 prijava'), s('pran', '19:45–20:15', 'slobodan ulaz', '3 prijave')] },
      { short: 'Sub', num: '17', long: 'Subota, 17.10.', list: [] },
      { short: 'Ned', num: '18', long: 'Nedjelja, 18.10.', list: [s('ash', '09:00–11:00', 'ulaz do 10:00', '6 prijava')] }
    ];
    const cur = week[this.state.day];
    return {
      days: week.map((d, i) => {
        const sel = i === this.state.day;
        return {
          short: d.short, num: d.num, selected: sel ? 'true' : 'false',
          bg: sel ? 'var(--ink)' : 'var(--white)',
          fg: sel ? 'var(--white)' : 'var(--ink)',
          border: sel ? 'var(--ink)' : 'var(--line)',
          dot: d.list.length ? (sel ? 'var(--mist-strong)' : 'var(--sage)') : 'transparent',
          pick: () => this.setState({ day: i })
        };
      }),
      dayTitle: cur.long,
      sessions: cur.list,
      hasSessions: cur.list.length > 0,
      noSessions: cur.list.length === 0
    };
  }
}
</script>
</body>
</html>
