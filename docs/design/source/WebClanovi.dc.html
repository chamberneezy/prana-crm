<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Web · Članovi</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/yogacrm/components/bundle.css">
<script src="ds/yogacrm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=Cormorant+Garamond:ital,wght@1,500&amp;family=Montserrat:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2a322e}a:hover{color:#5c6b58}
input::placeholder{color:#6a7268}
</style>
</helmet>
<div style="min-height: 1000px; display: flex; flex-wrap: wrap; background: var(--linen); font-family: var(--font-ui); color: var(--ink);">
  <x-import component-from-global-scope="YogaCRM.Sidebar" items="{{nav}}" active="members" logo-src="/_blob/0ddb75ad5382d4cb8d3056f0fcfdf42d" style="display: flex; align-self: stretch;"></x-import>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 48px 48px; box-sizing: border-box;">
    <div style="max-width: 1160px; display: flex; flex-direction: column; gap: 20px;">
      <x-import component-from-global-scope="YogaCRM.PageHeader" title="Članovi">
        <label style="display: flex; align-items: center; gap: 8px; height: 40px; width: 280px; max-width: 100%; padding: 0 12px; box-sizing: border-box; background: var(--white); border: 1px solid var(--field); border-radius: 8px; color: var(--muted);">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Pretraži članove</span>
          <input type="search" placeholder="Ime, e-mail ili telefon" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: var(--font-ui); font-size: 14px; color: var(--ink);">
        </label>
        <a href="WebUvoz.dc.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; border-radius: 8px; background: var(--ink); color: var(--white); text-decoration: none; font-size: 14px; font-weight: 600;">Novi član</a>
      </x-import>

      <div role="tablist" aria-label="Filtar" style="display: flex; flex-wrap: wrap; gap: 6px;">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
          <button type="button" role="tab" aria-selected="{{f.selected}}" onClick="{{f.pick}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: var(--ink); font-family: var(--font-ui); font-size: 13px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums;">{{f.label}}</button>
        </sc-for>
      </div>

      <section aria-label="Popis članova" style="background: var(--white); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;">
        <div style="display: flex; gap: 14px; padding: 10px 16px; background: var(--header-row); font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted);">
          <span style="flex: 1;">{{countLabel}}</span>
          <span>Stanje</span>
        </div>
        <sc-for list="{{members}}" as="m" hint-placeholder-count="8">
          <a href="WebProfil.dc.html" style="display: block; text-decoration: none; color: inherit;">
            <x-import component-from-global-scope="YogaCRM.MemberRow" name="{{m.name}}" sub="{{m.sub}}" note="{{m.note}}" status="{{m.status}}" status-label="{{m.label}}"></x-import>
          </a>
        </sc-for>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const all = [
      { name: 'Ana Horvat', sub: '2× tjedno · 6/8 dolazaka · zadnji dolazak 07.10.', note: 'Hernija L5', status: 'expiring', label: 'Ističe za 3 dana' },
      { name: 'Marko Kovač', sub: '1× tjedno · 2/4 dolaska · zadnji dolazak 30.09.', note: '', status: 'unpaid', label: '' },
      { name: 'Iva Babić', sub: '3× tjedno · 9/12 dolazaka · zadnji dolazak 09.10.', note: '', status: 'expiring', label: 'Ističe za 5 dana' },
      { name: 'Petra Jurić', sub: 'Neograničeno · 11 dolazaka · zadnji dolazak 11.10.', note: '', status: 'active', label: '' },
      { name: 'Luka Novak', sub: '2× tjedno · 4/8 dolazaka · zadnji dolazak 08.10.', note: 'Koljeno', status: 'active', label: '' },
      { name: 'Maja Knežević', sub: 'Proba · 1 dolazak · 09.10.', note: '', status: 'trial', label: '' },
      { name: 'Sara Pavlović', sub: '2× tjedno · 3/8 dolazaka · zadnji dolazak 05.10.', note: '', status: 'active', label: '' },
      { name: 'Tomislav Marić', sub: '1× tjedno · pauza do 01.11.', note: '', status: 'frozen', label: '' }
    ];
    const defs = [
      { id: 'all', label: 'Svi' },
      { id: 'active', label: 'Aktivni' },
      { id: 'expiring', label: 'Ističu' },
      { id: 'unpaid', label: 'Neplaćeno' },
      { id: 'trial', label: 'Proba' },
      { id: 'frozen', label: 'Zamrznuti' }
    ];
    const f = this.state.filter;
    const members = f === 'all' ? all : all.filter((m) => m.status === f);
    return {
      nav: [
        { id: 'overview', label: 'Pregled' },
        { id: 'schedule', label: 'Raspored' },
        { id: 'classes', label: 'Vrste satova' },
        { id: 'members', label: 'Članovi' },
        { id: 'plans', label: 'Karte i članarine' },
        { id: 'payments', label: 'Uplate' }
      ],
      countLabel: members.length + (members.length === 1 ? ' član' : ' članova'),
      members: members.map((m) => ({ ...m, note: m.note || undefined, label: m.label || undefined })),
      filters: defs.map((d) => {
        const n = d.id === 'all' ? all.length : all.filter((m) => m.status === d.id).length;
        const sel = d.id === f;
        return {
          label: d.label + ' ' + n,
          selected: sel ? 'true' : 'false',
          bg: sel ? 'var(--mist)' : 'var(--white)',
          border: sel ? 'var(--sage-deep)' : 'var(--field)',
          pick: () => this.setState({ filter: d.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
