<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Članovi</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds/yogacrm/components/bundle.css">
<script src="ds/yogacrm/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=Cormorant+Garamond:ital,wght@1,500&amp;family=Montserrat:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2a322e}a:hover{color:#5c6b58}
input::placeholder{color:#6a7268}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--linen); font-family: var(--font-ui); color: var(--ink);">
  <main style="padding: 60px 16px 108px; display: flex; flex-direction: column; gap: 14px;">
    <header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-muted);">{{countLabel}}</span>
        <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.2;">Članovi</h1>
      </div>
      <a href="NoviClan.dc.html" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 8px; background: var(--ink); color: var(--white); text-decoration: none; font-size: 13px; font-weight: 600;">Novi član</a>
    </header>

    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: var(--white); border: 1px solid var(--field); border-radius: 8px; color: var(--muted);">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Pretraži članove</span>
      <input type="search" placeholder="Ime, e-mail ili telefon" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: var(--font-ui); font-size: 14px; color: var(--ink);">
    </label>

    <div role="tablist" aria-label="Filtar" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{f.selected}}" onClick="{{f.pick}}" style="flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: var(--ink); font-family: var(--font-ui); font-size: 13px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums;">{{f.label}}</button>
      </sc-for>
    </div>

    <section aria-label="Popis članova" style="background: var(--white); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;">
      <sc-for list="{{members}}" as="m" hint-placeholder-count="7">
        <a href="Profil.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); text-decoration: none; color: var(--ink);">
          <x-import component-from-global-scope="YogaCRM.Avatar" name="{{m.name}}" size="{{size}}"></x-import>
          <span style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
            <span style="font-size: 14px; font-weight: 600;">{{m.name}}</span>
            <span style="font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;">{{m.plan}} · {{m.visits}}</span>
          </span>
          <x-import component-from-global-scope="YogaCRM.StatusChip" status="{{m.status}}">{{m.label}}</x-import>
        </a>
      </sc-for>
    </section>
  </main>

  <nav aria-label="Glavna navigacija" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 8px 0; background: var(--white); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: flex-start;">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; padding-top: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted);">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
      Pregled
    </a>
    <a href="Raspored.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; padding-top: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted);">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      Raspored
    </a>
    <a href="NoviClan.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; margin-top: -24px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--ink);">
      <span style="width: 56px; height: 56px; border-radius: 999px; background: var(--ink); color: var(--white); display: flex; align-items: center; justify-content: center; border: 4px solid var(--linen); box-sizing: border-box;">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"></path></svg>
      </span>
      Upis
    </a>
    <a href="Clanovi.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; padding-top: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--ink);">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      Članovi
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; padding-top: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: var(--muted);">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>
      Uplate
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const all = [
      { name: 'Ana Horvat', plan: '2× tjedno', visits: '6/8 dolazaka', status: 'expiring', label: 'Ističe za 3 dana' },
      { name: 'Marko Kovač', plan: '1× tjedno', visits: '2/4 dolaska', status: 'unpaid', label: 'Neplaćeno' },
      { name: 'Iva Babić', plan: '3× tjedno', visits: '9/12 dolazaka', status: 'expiring', label: 'Ističe za 5 dana' },
      { name: 'Petra Jurić', plan: 'Neograničeno', visits: '11 dolazaka', status: 'active', label: '' },
      { name: 'Luka Novak', plan: '2× tjedno', visits: '4/8 dolazaka', status: 'active', label: '' },
      { name: 'Maja Knežević', plan: 'Proba', visits: '1 dolazak', status: 'trial', label: '' },
      { name: 'Sara Pavlović', plan: '2× tjedno', visits: '3/8 dolazaka', status: 'active', label: '' },
      { name: 'Tomislav Marić', plan: '1× tjedno', visits: 'pauza do 01.11.', status: 'frozen', label: '' }
    ];
    const defs = [
      { id: 'all', label: 'Svi' },
      { id: 'active', label: 'Aktivni' },
      { id: 'expiring', label: 'Ističu' },
      { id: 'unpaid', label: 'Neplaćeno' },
      { id: 'trial', label: 'Proba' },
      { id: 'frozen', label: 'Zamrznuti' }
    ];
    const f = this.state.filter;
    const members = f === 'all' ? all : all.filter((m) => m.status === f);
    return {
      size: 36,
      countLabel: members.length + (members.length === 1 ? ' član' : ' članova'),
      members,
      filters: defs.map((d) => {
        const n = d.id === 'all' ? all.length : all.filter((m) => m.status === d.id).length;
        const sel = d.id === f;
        return {
          label: d.label + ' ' + n,
          selected: sel ? 'true' : 'false',
          bg: sel ? 'var(--mist)' : 'var(--white)',
          border: sel ? 'var(--sage-deep)' : 'var(--field)',
          pick: () => this.setState({ filter: d.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
